worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    limit_conn_zone "file-api" zone=file_requests:1m;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;
        client_max_body_size 11m;

        location = /v1/files {
            limit_conn file_requests 2;
            limit_conn_status 429;
            error_page 429 = @file_capacity;
            proxy_request_buffering off;
            proxy_buffering off;
            set $fixed_upstream sandbox:8080;
            proxy_pass http://$fixed_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 40s;
            proxy_send_timeout 40s;
        }

        location @file_capacity {
            default_type application/json;
            return 429 '{"error":{"code":"file_capacity_exceeded","message":"too many file requests are running"}}';
        }

        location = /v1/commands:stream {
            proxy_buffering off;
            set $fixed_upstream sandbox:8080;
            proxy_pass http://$fixed_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 40s;
            proxy_send_timeout 40s;
        }

        location / {
            set $fixed_upstream sandbox:8080;
            proxy_pass http://$fixed_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 40s;
            proxy_send_timeout 40s;
        }
    }
}

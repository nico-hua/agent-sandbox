[project]
name = "agent-sandbox-control"
version = "0.1.0"
description = "Local control-plane skeleton for agent-sandbox"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "docker_integration: explicitly enabled tests that create Docker resources",
]

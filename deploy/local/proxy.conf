worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    limit_conn_zone "file-api" zone=file_requests:1m;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;
        client_max_body_size 11m;
        # Translate errors generated by this gateway and preserve upstream responses.
        proxy_intercept_errors off;
        error_page 413 = @request_too_large;
        error_page 500 = @internal_error;
        error_page 502 503 = @upstream_unavailable;
        error_page 504 = @upstream_timeout;

        location @request_too_large {
            default_type application/json;
            return 413 '{"code":413,"message":"request body is too large","data":null}';
        }

        location @internal_error {
            default_type application/json;
            return 500 '{"code":500,"message":"internal server error","data":null}';
        }

        location @upstream_unavailable {
            default_type application/json;
            return 503 '{"code":503,"message":"upstream is unavailable","data":null}';
        }

        location @upstream_timeout {
            default_type application/json;
            return 504 '{"code":504,"message":"upstream request timed out","data":null}';
        }

        location = /v1/files {
            limit_conn file_requests 2;
            limit_conn_status 429;
            # Local error_page directives replace the server defaults in this location.
            error_page 413 = @request_too_large;
            error_page 500 = @internal_error;
            error_page 502 503 = @upstream_unavailable;
            error_page 504 = @upstream_timeout;
            error_page 429 = @file_capacity;
            proxy_request_buffering off;
            proxy_buffering off;
            set $fixed_upstream sandbox:8080;
            proxy_pass http://$fixed_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 40s;
            proxy_send_timeout 40s;
        }

        location @file_capacity {
            default_type application/json;
            return 429 '{"code":429,"message":"too many file requests are running","data":null}';
        }

        location = /v1/commands:stream {
            proxy_buffering off;
            set $fixed_upstream sandbox:8080;
            proxy_pass http://$fixed_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 40s;
            proxy_send_timeout 40s;
        }

        location / {
            set $fixed_upstream sandbox:8080;
            proxy_pass http://$fixed_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 40s;
            proxy_send_timeout 40s;
        }
    }
}

[project]
name = "agent-sandbox-sdk"
version = "0.1.0"
description = "Synchronous local HTTP SDK for Agent Sandbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1,<1"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_sandbox"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-timeout>=2.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sdk_integration: explicitly enabled SDK tests against a dedicated isolated control plane"]
